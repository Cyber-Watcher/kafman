# Test cluster for kafman development.
#
# Three Kafka brokers in KRaft mode (no ZooKeeper), each exposing four listeners
# so every connection profile kafman must support can be exercised:
#
#   broker    PLAINTEXT   SASL_PLAINTEXT   SASL_SSL   JMX metrics   node_exporter
#   kafka-1   9092        9093             9094       9404          9100
#   kafka-2   9192        9193             9194       9405          9101
#   kafka-3   9292        9293             9294       9406          9102
#
# Three brokers rather than one so replication factor 3, ISR and
# under-replicated partitions are real and can be broken on purpose:
#   docker compose -f docker/compose.yml stop kafka-3
#
# Run docker/gen-certs.sh and docker/fetch-jmx-agent.sh first (make stack-up does).
#
# THIS STACK IS INSECURE BY DESIGN: hard-coded passwords, a throwaway CA and
# ANONYMOUS as a superuser. Local development only.

# Shared by the live-load services (profile "live").
#
# The CLI scripts are called by absolute path: /opt/kafka/bin is not in the
# image's PATH, and a bare `kafka-topics.sh` fails silently inside a retry loop.
x-live-common: &live-common
  image: apache/kafka:3.9.0
  restart: unless-stopped
  profiles: [live]
  depends_on: [kafka-1, kafka-2, kafka-3]
  environment: &live-env
    # The CLI tools inherit KAFKA_OPTS from the image and would try to bind the
    # JMX exporter port a second time; clearing it is what makes them usable.
    KAFKA_OPTS: ""
    BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092

# One command shared by every consumer; the group and the client id come from
# the environment, so the script itself is written once.
x-consume: &consume
  - sh
  - -c
  - |
    set -eu
    until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" \
        --describe --topic live.orders >/dev/null 2>&1; do
      echo "waiting for live.orders"; sleep 2
    done
    echo "joining $$GROUP as $$CLIENT_ID"
    exec /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server "$$BOOTSTRAP" \
      --topic live.orders --group "$$GROUP" \
      --consumer-property "client.id=$$CLIENT_ID" >/dev/null

# The same, reading one record every 200 ms. The console consumer blocks writing
# to a full pipe, so its position stops advancing and the group falls behind.
x-consume-slow: &consume-slow
  - sh
  - -c
  - |
    set -eu
    until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" \
        --describe --topic live.orders >/dev/null 2>&1; do
      echo "waiting for live.orders"; sleep 2
    done
    echo "joining $$GROUP as $$CLIENT_ID, one record every 200ms"
    /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server "$$BOOTSTRAP" \
      --topic live.orders --group "$$GROUP" \
      --consumer-property "client.id=$$CLIENT_ID" |
      while IFS= read -r _; do sleep 0.2; done

# Shared by the per-broker node_exporter services below.
x-node-exporter: &node-exporter
  image: prom/node-exporter:v1.9.1 # pinned: latest drifts under the tests
  restart: unless-stopped

x-kafka-common: &kafka-common
  image: apache/kafka:3.9.0
  restart: unless-stopped
  environment: &kafka-env
    CLUSTER_ID: kafman-test-cluster-01
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASLPLAIN:SASL_PLAINTEXT,SASLSSL:SASL_SSL

    # Replication: defaults matter because auto-created internal topics use them.
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    # Without this the image keeps its default log.dirs of /tmp/kafka-logs, and
    # every topic lives in the container's writable layer rather than on the
    # named volume below — recreating a container would then quietly wipe the
    # cluster while the volume sat there empty.
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_LOG_RETENTION_HOURS: 24

    # SASL: PLAIN users come from the JAAS file, SCRAM users from docker/init.sh.
    KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512

    # TLS for the SASL_SSL listener. PKCS#12 keystore, generated by gen-certs.sh
    # with openssl so no JDK is needed on the host.
    KAFKA_SSL_KEYSTORE_FILENAME: server.p12
    KAFKA_SSL_KEYSTORE_TYPE: PKCS12
    KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
    KAFKA_SSL_KEY_CREDENTIALS: key_creds
    KAFKA_SSL_CLIENT_AUTH: none
    KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https

    # ACLs, so kafman's ACL screens have something to manage.
    # ANONYMOUS is a superuser because the PLAINTEXT listener is unauthenticated
    # and init.sh bootstraps everything through it.
    KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
    KAFKA_SUPER_USERS: User:ANONYMOUS;User:admin
    KAFKA_ALLOW_EVERYONE_IF_NO_ACL_IS_FOUND: "true"

    KAFKA_HEAP_OPTS: -Xmx512M -Xms256M
    KAFKA_OPTS: >-
      -Djava.security.auth.login.config=/etc/kafka/jaas/kafka_jaas.conf
      -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=9404:/opt/jmx/jmx-exporter.yml
  healthcheck:
    # KAFKA_OPTS is cleared: the CLI tools inherit it from the server and would
    # try to bind the JMX exporter port a second time.
    test: ["CMD-SHELL", "KAFKA_OPTS= /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafman-kafka-1
    hostname: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://0.0.0.0:19092,PLAINTEXT://0.0.0.0:9092,SASLPLAIN://0.0.0.0:9093,SASLSSL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,PLAINTEXT://localhost:9092,SASLPLAIN://localhost:9093,SASLSSL://localhost:9094
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
      - "9404:9404"
    volumes:
      - ./certs:/etc/kafka/secrets:ro
      - ./jaas:/etc/kafka/jaas:ro
      - ./lib/jmx_prometheus_javaagent.jar:/opt/jmx/jmx_prometheus_javaagent.jar:ro
      - ./jmx-exporter.yml:/opt/jmx/jmx-exporter.yml:ro
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: kafman-kafka-2
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://0.0.0.0:19092,PLAINTEXT://0.0.0.0:9092,SASLPLAIN://0.0.0.0:9093,SASLSSL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,PLAINTEXT://localhost:9192,SASLPLAIN://localhost:9193,SASLSSL://localhost:9194
    ports:
      - "9192:9092"
      - "9193:9093"
      - "9194:9094"
      - "9405:9404"
    volumes:
      - ./certs:/etc/kafka/secrets:ro
      - ./jaas:/etc/kafka/jaas:ro
      - ./lib/jmx_prometheus_javaagent.jar:/opt/jmx/jmx_prometheus_javaagent.jar:ro
      - ./jmx-exporter.yml:/opt/jmx/jmx-exporter.yml:ro
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    container_name: kafman-kafka-3
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://0.0.0.0:19092,PLAINTEXT://0.0.0.0:9092,SASLPLAIN://0.0.0.0:9093,SASLSSL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,PLAINTEXT://localhost:9292,SASLPLAIN://localhost:9293,SASLSSL://localhost:9294
    ports:
      - "9292:9092"
      - "9293:9093"
      - "9294:9094"
      - "9406:9404"
    volumes:
      - ./certs:/etc/kafka/secrets:ro
      - ./jaas:/etc/kafka/jaas:ro
      - ./lib/jmx_prometheus_javaagent.jar:/opt/jmx/jmx_prometheus_javaagent.jar:ro
      - ./jmx-exporter.yml:/opt/jmx/jmx-exporter.yml:ro
      - kafka-3-data:/var/lib/kafka/data

  # ------------------------------------------------------------- node metrics ---
  #
  # One node_exporter per broker "node", for the Monitoring tab's OS section.
  # CPU, memory and load come from /proc, which is not namespaced — all three
  # exporters report the same host kernel, which is fine for a dev stand. The
  # broker's data volume is mounted read-only at the broker's log.dirs path, so
  # node_filesystem reports the filesystem under /var/lib/kafka/data and
  # kafman's data-dir match resolves end to end. The container's own root is an
  # overlay the exporter's fstype filter drops, so the stand has no root-"/"
  # gauge — kafman shows that gap as "root: —" rather than inventing one. (A
  # real deployment runs node_exporter on the host and has both.)

  node-1:
    <<: *node-exporter
    container_name: kafman-node-1
    ports:
      - "9100:9100"
    volumes:
      - kafka-1-data:/var/lib/kafka/data:ro

  node-2:
    <<: *node-exporter
    container_name: kafman-node-2
    ports:
      - "9101:9100"
    volumes:
      - kafka-2-data:/var/lib/kafka/data:ro

  node-3:
    <<: *node-exporter
    container_name: kafman-node-3
    ports:
      - "9102:9100"
    volumes:
      - kafka-3-data:/var/lib/kafka/data:ro

  # ---------------------------------------------------------------- live load ---
  #
  # Everything below runs under the "live" profile and is started separately:
  #
  #   make stack-live        # or: docker compose --profile live up -d
  #   make stack-live-down
  #
  # Without it every consumer group on the stack is Empty — offsets committed by
  # a consumer that has since exited — so the screens that show members, hosts,
  # assignments and Stable states have nothing to draw. These services keep real
  # consumers connected and a steady stream flowing, on a topic of their own
  # (`live.orders`) so the fixture counts the other tests assert on stay exactly
  # as init.sh left them.

  live-producer:
    <<: *live-common
    container_name: kafman-live-producer
    command:
      - sh
      - -c
      - |
        set -eu
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" \
            --describe --topic live.orders >/dev/null 2>&1; do
          echo "waiting for live.orders"; sleep 2
        done
        echo "producing to live.orders"
        i=0
        while :; do
          i=$$((i + 1))
          printf 'ord-%04d|{"id":"ord-%04d","status":"NEW","amount":%d.50,"source":"live"}\n' \
            "$$((i % 997))" "$$i" "$$((i % 400 + 10))"
          # ~20 records a second: enough for the charts to move, little enough
          # that a day of running does not fill a laptop's disk.
          sleep 0.05
        done | /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server "$$BOOTSTRAP" \
          --topic live.orders --property parse.key=true --property key.separator='|'

  # Three members of one group: enough for an assignment to be split and for a
  # rebalance to be visible when one of them is stopped.
  live-fast-1:
    <<: *live-common
    container_name: kafman-live-fast-1
    environment:
      <<: *live-env
      GROUP: live-orders-fast
      CLIENT_ID: fast-1
    command: *consume

  live-fast-2:
    <<: *live-common
    container_name: kafman-live-fast-2
    environment:
      <<: *live-env
      GROUP: live-orders-fast
      CLIENT_ID: fast-2
    command: *consume

  live-fast-3:
    <<: *live-common
    container_name: kafman-live-fast-3
    environment:
      <<: *live-env
      GROUP: live-orders-fast
      CLIENT_ID: fast-3
    command: *consume

  # One member that reads slower than the producer writes, so its lag grows and
  # the trend column has something to report.
  live-slow-1:
    <<: *live-common
    container_name: kafman-live-slow-1
    environment:
      <<: *live-env
      GROUP: live-orders-slow
      CLIENT_ID: slow-1
    command: *consume-slow

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
