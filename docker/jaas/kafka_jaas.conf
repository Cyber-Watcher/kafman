// JAAS configuration for the kafman test cluster.
//
// Applies to every SASL listener of the broker. SCRAM credentials are NOT
// listed here — in KRaft mode they live in the cluster metadata and are created
// by docker/init.sh; ScramLoginModule only has to be declared.
//
// TEST CREDENTIALS. Never reuse these anywhere.

KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="admin-secret"
        user_admin="admin-secret"
        user_kafman="kafman-secret"
        user_readonly="readonly-secret";

    org.apache.kafka.common.security.scram.ScramLoginModule required;
};
